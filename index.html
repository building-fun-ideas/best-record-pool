<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Record Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D13;
    --panel:#131822;
    --panel-2:#171D29;
    --border:#242B39;
    --text:#EEF1F6;
    --text-dim:#8991A3;
    --text-faint:#5C6478;
    --accent:#FFB238;
    --accent-soft:rgba(255,178,56,0.12);
    --live:#FF5D5D;
    --neg:#3A4256;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,"Segoe UI",Arial,sans-serif;
    min-height:100vh;
    padding:32px 18px 56px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:12px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand h1{
    font-family:'Sora',sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.2px;
    margin:0;color:var(--text);
  }
  .live-pill{
    display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--border);
    border-radius:20px;padding:4px 10px 4px 8px;font-size:11px;font-weight:700;letter-spacing:0.4px;color:var(--text-dim);
  }
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,93,93,0.5);}50%{opacity:0.55;box-shadow:0 0 0 4px rgba(255,93,93,0);}}
  @media (prefers-reduced-motion: reduce){.live-dot{animation:none;}}

  .status{text-align:right;}
  .status .updated{font-size:11px;color:var(--text-faint);margin-bottom:6px;}
  button.refresh{
    background:var(--accent);color:#1A1305;border:none;font-weight:700;
    font-size:13px;padding:9px 16px;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;
    transition:filter 0.15s ease;
  }
  button.refresh:disabled{opacity:0.5;cursor:default;}
  button.refresh:hover:not(:disabled){filter:brightness(1.08);}

  .hero{
    background:linear-gradient(135deg, var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--border);border-radius:16px;
    padding:24px 26px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:18px;position:relative;overflow:hidden;
  }
  .hero::before{
    content:'';position:absolute;top:0;left:0;bottom:0;width:4px;
    background:linear-gradient(180deg, var(--accent), transparent);
  }
  .hero-left{display:flex;align-items:center;gap:16px;}
  .avatar{
    width:52px;height:52px;border-radius:50%;background:var(--accent-soft);border:1px solid rgba(255,178,56,0.35);
    display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;
    font-size:18px;color:var(--accent);flex:0 0 52px;
  }
  .hero .label{font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-faint);font-weight:700;margin-bottom:4px;}
  .hero .leader-name{font-family:'Sora',sans-serif;font-weight:700;font-size:24px;color:var(--text);}
  .hero .margin{font-size:12.5px;color:var(--text-dim);margin-top:3px;}
  .hero .num{font-family:'Sora',sans-serif;font-weight:800;font-size:44px;color:var(--accent);line-height:1;text-align:right;}
  .hero .num small{display:block;font-size:11px;font-weight:600;color:var(--text-faint);margin-top:4px;text-transform:uppercase;letter-spacing:0.4px;}

  .listhead{
    display:grid;grid-template-columns:32px 1fr 130px;gap:10px;padding:0 14px 8px;
    font-size:10.5px;font-weight:700;letter-spacing:0.5px;color:var(--text-faint);text-transform:uppercase;
  }
  .listhead .num{text-align:right;}

  .row{
    display:grid;grid-template-columns:32px 1fr 130px;gap:10px;align-items:center;
    padding:13px 14px;border-bottom:1px solid var(--border);
  }
  .numrow{display:flex;justify-content:flex-end;gap:22px;}
  .numrow .num-cell{width:56px;text-align:right;}
  .row.lead{background:var(--panel);border-radius:10px;border-bottom:1px solid var(--border);}
  .row.tie-top{box-shadow:inset 0 1px 0 0 rgba(255,178,56,0.4);}
  .rankbadge{
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'Sora',sans-serif;font-weight:700;font-size:12.5px;color:var(--text-dim);background:var(--panel-2);
    border:1px solid var(--border);
  }
  .row.lead .rankbadge{background:var(--accent);color:#1A1305;border-color:var(--accent);}
  .playername{font-weight:700;font-size:14.5px;color:var(--text);}
  .teams{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;}
  .chip{
    display:inline-flex;align-items:center;gap:5px;background:var(--panel-2);
    border:1px solid var(--border);border-radius:14px;padding:3px 8px 3px 4px;
    font-size:11px;white-space:nowrap;font-weight:600;color:var(--text-dim);
  }
  .swatch{width:8px;height:8px;border-radius:50%;flex:0 0 8px;}
  .chip .rec{color:var(--text-faint);font-weight:500;}
  .chip .contrib{color:var(--accent);font-weight:700;}
  .num-cell{text-align:right;}
  .wins{font-weight:800;font-size:16px;font-family:'Sora',sans-serif;color:var(--text);}
  .pf{font-size:11px;color:var(--text-faint);margin-top:2px;}

  .empty{text-align:center;padding:48px 20px;border:1px dashed var(--border);border-radius:14px;color:var(--text-dim);}
  .empty button.refresh{margin-top:16px;}

  details.rules{margin-top:34px;border-top:1px solid var(--border);padding-top:16px;font-size:13px;color:var(--text-dim);}
  details.rules summary{cursor:pointer;color:var(--text);font-weight:700;font-size:13px;list-style:none;}
  details.rules summary::-webkit-details-marker{display:none;}
  details.rules summary::before{content:'▸ ';color:var(--accent);}
  details.rules[open] summary::before{content:'▾ ';}
  details.rules ol{margin:12px 0 0;padding-left:18px;line-height:1.7;}

  .footnote{margin-top:12px;font-size:11px;color:var(--text-faint);}
  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2A1414;color:#FFD3D3;
    border:1px solid #4A2020;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.4);
    max-width:90%;text-align:center;
  }

  .mlabel{display:none;}
  @media (max-width:520px){
    .listhead{display:none;}
    .row{grid-template-columns:28px 1fr;row-gap:8px;}
    .numrow{
      grid-column:2;justify-content:flex-start;gap:20px;
      border-top:1px solid var(--border);padding-top:8px;margin-top:1px;
    }
    .numrow .num-cell{width:auto;text-align:left;}
    .mlabel{display:inline;font-size:10.5px;color:var(--text-faint);font-weight:600;text-transform:uppercase;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function(){

  var TEAM_META = {
    BAL:{full:'Baltimore Ravens', color:'#241773'},  NYG:{full:'New York Giants', color:'#0B2265'},
    CAR:{full:'Carolina Panthers', color:'#0085CA'}, LAR:{full:'Los Angeles Rams', color:'#003594'},
    NO:{full:'New Orleans Saints', color:'#D3BC8D'}, TEN:{full:'Tennessee Titans', color:'#4B92DB'},
    BUF:{full:'Buffalo Bills', color:'#00338D'},     WSH:{full:'Washington Commanders', color:'#5A1414'},
    IND:{full:'Indianapolis Colts', color:'#002C5F'},SEA:{full:'Seattle Seahawks', color:'#69BE28'},
    DET:{full:'Detroit Lions', color:'#0076B6'},     PIT:{full:'Pittsburgh Steelers', color:'#FFB612'},
    ATL:{full:'Atlanta Falcons', color:'#A71930'},   PHI:{full:'Philadelphia Eagles', color:'#004C54'},
    MIN:{full:'Minnesota Vikings', color:'#4F2683'}, DEN:{full:'Denver Broncos', color:'#FB4F14'},
    TB:{full:'Tampa Bay Buccaneers', color:'#D50A0A'},NE:{full:'New England Patriots', color:'#002244'},
    JAX:{full:'Jacksonville Jaguars', color:'#006778'},SF:{full:'San Francisco 49ers', color:'#AA0000'},
    GB:{full:'Green Bay Packers', color:'#203731'},  CIN:{full:'Cincinnati Bengals', color:'#FB4F14'},
    CHI:{full:'Chicago Bears', color:'#0B162A'},     KC:{full:'Kansas City Chiefs', color:'#E31837'},
    DAL:{full:'Dallas Cowboys', color:'#869397'},    LAC:{full:'Los Angeles Chargers', color:'#0080C6'},
    HOU:{full:'Houston Texans', color:'#03202F'}
  };

  var TEAM_IDS = {
    BAL:33, NYG:19, CAR:29, LAR:14, NO:18, TEN:10,
    BUF:2,  WSH:28, IND:11, SEA:26, DET:8,  PIT:23,
    ATL:1,  PHI:21, MIN:16, DEN:7,  TB:27,  NE:17,
    JAX:30, SF:25,  GB:9,   CIN:4,  CHI:3,  KC:12,
    DAL:6,  LAC:24, HOU:34
  };

  var DRAFT = [
    {name:'Jon',      teams:['BAL','NYG','CAR']},
    {name:'Nathalie', teams:['LAR','NO','TEN']},
    {name:'Roger',    teams:['BUF','WSH','CAR']},
    {name:'Pam',      teams:['SEA','IND','CAR']},
    {name:'Tim',      teams:['DET','PIT','ATL']},
    {name:'Phil',     teams:['PHI','MIN','ATL']},
    {name:'Jason',    teams:['DEN','TB','CAR']},
    {name:'Brian',    teams:['NE','JAX','CAR']},
    {name:'Matthew',  teams:['SF','GB','CAR']},
    {name:'Will',     teams:['CIN','CHI','ATL']},
    {name:'Fred',     teams:['KC','DAL','CAR']},
    {name:'Dana',     teams:['LAC','HOU','CAR']}
  ];

  var state = { standings: {}, updatedAt: null, loading: true, errors: [] };

  function fmtTime(iso){
    if(!iso) return 'Never';
    var d = new Date(iso);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' · ' +
      d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  }

  function winScore(rec){ if(!rec) return null; return rec.w + 0.5 * (rec.t || 0); }

  function computeRanking(){
    var rows = DRAFT.map(function(entry){
      var recs = entry.teams.map(function(a){ return state.standings[a] || null; });
      var hasAll = recs.every(function(r){ return r; });
      var wins = hasAll ? recs.reduce(function(s,r){ return s + winScore(r); },0) : null;
      var pf = hasAll ? recs.reduce(function(s,r){ return s + (r.pf||0); },0) : null;
      return { name: entry.name, teams: entry.teams, wins: wins, pf: pf };
    });
    rows.sort(function(a,b){
      if(a.wins==null && b.wins==null) return 0;
      if(a.wins==null) return 1;
      if(b.wins==null) return -1;
      if(b.wins !== a.wins) return b.wins - a.wins;
      return (b.pf||0) - (a.pf||0);
    });
    return rows;
  }

  function initials(name){
    return name.slice(0,2).toUpperCase();
  }

  function render(){
    var root = document.getElementById('root');
    var rows = computeRanking();
    var haveAny = Object.keys(state.standings).length > 0;
    var html = '';
    html += '<div class="wrap">';

    html += '<div class="topbar"><div class="brand"><h1>Best Record Pool</h1>';
    html += '<span class="live-pill"><span class="live-dot"></span>LIVE</span></div>';
    html += '<div class="status"><div class="updated">' + (state.loading ? 'Loading…' : 'Updated ' + fmtTime(state.updatedAt)) + '</div>';
    html += '<div style="font-size:10px;color:var(--text-faint);margin-bottom:6px;">Auto-refreshes every 2 min</div>';
    html += '<button class="refresh" id="refreshBtn" ' + (state.loading?'disabled':'') + '>' + (state.loading?'Fetching…':'Refresh') + '</button></div></div>';

    if(!haveAny && !state.loading){
      html += '<div class="empty">Could not load standings.';
      if(state.errors && state.errors.length){
        html += '<div style="margin-top:8px;font-size:11px;opacity:0.8;">' + state.errors[0] + '</div>';
      }
      html += '<br><button class="refresh" id="refreshBtnEmpty">Try again</button></div>';
    } else if(haveAny){
      var leader = rows[0], second = rows[1];
      var margin = (leader && second && leader.wins!=null && second.wins!=null) ? (leader.wins - second.wins) : null;
      html += '<div class="hero"><div class="hero-left"><div class="avatar">' + (leader ? initials(leader.name) : '—') + '</div><div>';
      html += '<div class="label">Currently leading</div>';
      html += '<div class="leader-name">' + (leader ? leader.name : '—') + '</div>';
      html += '<div class="margin">' + (margin!=null ? (margin===0 ? 'Tied with ' + second.name : 'Leads ' + second.name + ' by ' + margin) : '') + '</div></div></div>';
      html += '<div class="num">' + (leader && leader.wins!=null ? leader.wins : '—') + '<small>Combined wins</small></div></div>';

      html += '<div class="listhead"><div>#</div><div>Player &amp; teams</div><div class="num">Wins</div><div class="num">Pts</div></div>';
      rows.forEach(function(r, i){
        var isTieTop = i>0 && rows[i-1].wins!=null && r.wins!=null && rows[i-1].wins===r.wins;
        html += '<div class="row' + (i===0 && r.wins!=null?' lead':'') + (isTieTop?' tie-top':'') + '">';
        html += '<div class="rankbadge">' + (i+1) + '</div>';
        html += '<div><div class="playername">' + r.name + '</div><div class="teams">';
        r.teams.forEach(function(abbr){
          var t = TEAM_META[abbr];
          var rec = state.standings[abbr];
          var recTxt = rec ? (rec.w + '-' + rec.l + (rec.t? '-' + rec.t : '')) : '—';
          var contribTxt = rec ? winScore(rec) : null;
          html += '<span class="chip"><span class="swatch" style="background:' + t.color + '"></span>' + abbr + ' <span class="rec">' + recTxt + '</span>' + (contribTxt!=null ? ' <span class="contrib">' + contribTxt + '</span>' : '') + '</span>';
        });
        html += '</div></div>';
        html += '<div class="numrow">';
        html += '<div class="num-cell"><span class="mlabel">W&nbsp;</span><span class="wins">' + (r.wins!=null ? r.wins : '—') + '</span></div>';
        html += '<div class="num-cell"><span class="mlabel">PTS&nbsp;</span><span class="pf">' + (r.pf!=null ? r.pf : '—') + '</span></div>';
        html += '</div>';
        html += '</div>';
      });
      if(state.errors && state.errors.length){
        html += '<div class="footnote">Couldn\'t reach ESPN for: ' + state.errors.join(', ') + '. Try refreshing again shortly.</div>';
      }
    }

    html += '<details class="rules"><summary>Pool rules</summary><ol>';
    html += '<li>Each player\'s score is the combined regular-season win total of their 3 drafted teams.</li>';
    html += '<li>A tie counts as half a win.</li>';
    html += '<li>$25 entry · $200 to 1st, plus a scaled 2nd-place payout for the 12-player field.</li>';
    html += '<li>Ties in total wins are broken by combined points scored across the 3 teams.</li>';
    html += '<li>Rounds 1–2 were a snake draft; round 3 was open — any remaining team could be taken by anyone, so some teams (like Carolina and Atlanta) are owned by multiple players.</li>';
    html += '</ol></details>';
    html += '<div class="footnote">Records pulled live from ESPN, directly in your browser, on each page load. Just refresh the page for the latest.</div>';
    html += '</div>';

    root.innerHTML = html;
    var rb = document.getElementById('refreshBtn');
    if(rb) rb.onclick = function(){ load(); };
    var rbe = document.getElementById('refreshBtnEmpty');
    if(rbe) rbe.onclick = function(){ load(); };
  }

  function showToast(msg){
    var el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 4000);
  }

  async function fetchTeam(abbr, id){
    var url = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/' + id;
    var res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status + ' for ' + abbr);
    var data = await res.json();
    var items = (data.team && data.team.record && data.team.record.items) || [];
    var total = items.filter(function(i){ return i.type === 'total'; })[0];
    if(!total) throw new Error('No record data for ' + abbr);
    function stat(name){
      var found = total.stats.filter(function(s){ return s.name === name; })[0];
      return found ? found.value : 0;
    }
    return { w: stat('wins'), l: stat('losses'), t: stat('ties'), pf: stat('pointsFor') };
  }

  async function load(silent){
    if(!silent){
      state.loading = true;
      render();
    }
    var abbrs = Object.keys(TEAM_IDS);
    var results = await Promise.allSettled(abbrs.map(function(abbr){
      return fetchTeam(abbr, TEAM_IDS[abbr]);
    }));
    var standings = {};
    var errors = [];
    results.forEach(function(result, i){
      var abbr = abbrs[i];
      if(result.status === 'fulfilled'){
        standings[abbr] = result.value;
      } else {
        errors.push(abbr + ': ' + result.reason.message);
      }
    });
    // On a silent background refresh, don't wipe out good data with an
    // empty result if this particular fetch pass happened to fail.
    if(Object.keys(standings).length > 0 || !silent){
      state.standings = standings;
      state.errors = errors;
      state.updatedAt = new Date().toISOString();
    }
    state.loading = false;
    render();
    if(errors.length && Object.keys(standings).length === 0 && !silent){
      showToast('Could not reach ESPN from your browser (' + errors[0] + ').');
    }
  }

  load();

  // Auto-refresh every 2 minutes while the tab is open and visible.
  // Paused when the tab is hidden so it doesn't fetch pointlessly in the
  // background; catches up right away when you switch back to it.
  var AUTO_REFRESH_MS = 2 * 60 * 1000;
  var lastLoadTime = Date.now();
  setInterval(function(){
    if(document.visibilityState === 'visible'){
      lastLoadTime = Date.now();
      load(true);
    }
  }, AUTO_REFRESH_MS);

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && Date.now() - lastLoadTime > AUTO_REFRESH_MS){
      lastLoadTime = Date.now();
      load(true);
    }
  });
})();
</script>
</body>
</html>
